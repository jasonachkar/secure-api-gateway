name: Deploy Dashboard (Azure Static Web Apps)

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
      - '.github/workflows/azure-playwright.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    outputs:
      api_url: ${{ steps.azure-urls.outputs.api_url }}
      dashboard_url: ${{ steps.azure-urls.outputs.dashboard_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Query and validate current Azure URLs
        id: azure-urls
        shell: bash
        run: |
          set -euo pipefail
          fqdn=$(az containerapp show \
            --name '${{ secrets.CONTAINER_APP_NAME }}' \
            --resource-group '${{ secrets.RESOURCE_GROUP }}' \
            --query properties.configuration.ingress.fqdn -o tsv)
          dashboard_host=$(az staticwebapp show \
            --name '${{ secrets.STATIC_WEB_APP_NAME }}' \
            --resource-group '${{ secrets.RESOURCE_GROUP }}' \
            --query defaultHostname -o tsv)
          api_url="https://${fqdn}"
          dashboard_url="https://${dashboard_host}"
          node -e "for (const value of process.argv.slice(1)) { const url = new URL(value); if (url.protocol !== 'https:' || url.origin !== value) process.exit(1) }" "$api_url" "$dashboard_url"
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"
          echo "dashboard_url=$dashboard_url" >> "$GITHUB_OUTPUT"
          echo "VITE_API_URL=$api_url" >> "$GITHUB_ENV"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /dashboard
          output_location: dist

  smoke:
    name: Public Azure session journey
    needs: deploy
    uses: ./.github/workflows/azure-playwright.yml
    with:
      dashboard_url: ${{ needs.deploy.outputs.dashboard_url }}
      api_url: ${{ needs.deploy.outputs.api_url }}
