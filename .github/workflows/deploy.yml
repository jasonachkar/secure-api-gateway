name: Deploy Backend to Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build and deploy (defaults to the triggering commit SHA)
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$(cut -d. -f1 <<< '${{ secrets.ACR_LOGIN_SERVER }}')"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/secure-api-gateway:${{ inputs.image_tag || github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/secure-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name '${{ secrets.CONTAINER_APP_NAME }}' \
            --resource-group '${{ secrets.RESOURCE_GROUP }}' \
            --image '${{ secrets.ACR_LOGIN_SERVER }}/secure-api-gateway:${{ inputs.image_tag || github.sha }}'

      - name: Verify readiness, CORS, login, logout, and revoked reuse
        shell: bash
        run: |
          set -euo pipefail
          api_fqdn=$(az containerapp show --name '${{ secrets.CONTAINER_APP_NAME }}' --resource-group '${{ secrets.RESOURCE_GROUP }}' --query properties.configuration.ingress.fqdn -o tsv)
          dashboard_host=$(az staticwebapp show --name '${{ secrets.STATIC_WEB_APP_NAME }}' --resource-group '${{ secrets.RESOURCE_GROUP }}' --query defaultHostname -o tsv)
          if [ -z "$api_fqdn" ]; then
            echo "::error::Container App ingress FQDN is empty"
            exit 1
          fi
          if [ -z "$dashboard_host" ]; then
            echo "::error::Static Web App default hostname is empty"
            exit 1
          fi
          api_url="https://${api_fqdn}"
          dashboard_origin="https://${dashboard_host}"
          work_dir=$(mktemp -d)
          trap 'rm -rf "$work_dir"' EXIT

          ready=false
          ready_status=000
          for attempt in $(seq 1 30); do
            ready_status=$(curl -sS -o "$work_dir/ready.json" -w '%{http_code}' "$api_url/readyz" || true)
            if [ "$ready_status" = 200 ] && jq -e '.status == "ok" and .redis == "ok"' "$work_dir/ready.json" >/dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "::error::API readiness failed after 30 attempts (last HTTP status: $ready_status)"
            jq -c . "$work_dir/ready.json" 2>/dev/null || true
            exit 1
          fi

          preflight_status=$(curl -sS -D "$work_dir/preflight.headers" -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H "Origin: $dashboard_origin" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: Content-Type' \
            "$api_url/auth/demo-login")
          if [ "$preflight_status" != 200 ] && [ "$preflight_status" != 204 ]; then
            echo "::error::CORS preflight returned HTTP $preflight_status (expected 200 or 204)"
            exit 1
          fi
          if ! grep -iq "^access-control-allow-origin: $dashboard_origin" "$work_dir/preflight.headers"; then
            echo "::error::CORS preflight did not allow dashboard origin $dashboard_origin"
            exit 1
          fi
          if ! grep -Eiq '^access-control-allow-methods:.*POST' "$work_dir/preflight.headers"; then
            echo "::error::CORS preflight did not allow POST"
            exit 1
          fi
          if ! grep -Eiq '^access-control-allow-headers:.*Content-Type' "$work_dir/preflight.headers"; then
            echo "::error::CORS preflight did not allow Content-Type"
            exit 1
          fi

          login_status=$(curl -sS -c "$work_dir/cookies.txt" -H "Origin: $dashboard_origin" \
            -H 'Content-Type: application/json' -X POST --data '{}' \
            "$api_url/auth/demo-login" -o "$work_dir/login.json" -w '%{http_code}')
          if [ "$login_status" != 200 ]; then
            echo "::error::Demo login returned HTTP $login_status"
            jq -c '.error // {message: .message}' "$work_dir/login.json" 2>/dev/null || true
            exit 1
          fi
          token=$(jq -er '.accessToken' "$work_dir/login.json")
          cp "$work_dir/cookies.txt" "$work_dir/old-cookies.txt"
          logout_status=$(curl -sS -b "$work_dir/cookies.txt" -c "$work_dir/cookies.txt" \
            -H "Origin: $dashboard_origin" -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -X POST --data '{}' \
            "$api_url/auth/logout" -o "$work_dir/logout.json" -w '%{http_code}')
          if [ "$logout_status" != 200 ]; then
            echo "::error::Logout returned HTTP $logout_status"
            jq -c '.error // {message: .message}' "$work_dir/logout.json" 2>/dev/null || true
            exit 1
          fi
          jq -e '.message | type == "string"' "$work_dir/logout.json" >/dev/null
          reuse_status=$(curl -sS -b "$work_dir/old-cookies.txt" -H "Origin: $dashboard_origin" \
            -o /dev/null -w '%{http_code}' -X POST "$api_url/auth/refresh")
          if [ "$reuse_status" != 401 ]; then
            echo "::error::Revoked refresh-token reuse returned HTTP $reuse_status (expected 401)"
            exit 1
          fi
