name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'package*.json'
      - 'mock-service/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'package*.json'
      - 'mock-service/**'
      - '.github/workflows/docker.yml'

permissions:
  contents: read
  security-events: write # for SARIF upload

jobs:
  build-and-scan:
    name: Build & scan gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secure-api-gateway:ci -f Dockerfile .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: secure-api-gateway:ci
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # report, don't block - flip to '1' once the baseline is clean

      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-gateway

  build-mock-service:
    name: Build mock-service image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mock-upstream-service:ci -f mock-service/Dockerfile mock-service
