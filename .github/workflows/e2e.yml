name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reviewer-journey:
    name: Reviewer journey + accessibility (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ALGORITHM: HS256
      # CI-only value, never used outside this ephemeral job - not a real secret.
      JWT_SECRET: e2e-ci-only-secret-not-used-anywhere-else-min-32-chars
      COOKIE_SECRET: e2e-ci-only-cookie-secret-min-32-chars-long
      ENABLE_SWAGGER: 'false'
      DEMO_MODE: 'false'
      # The suite intentionally exercises many full-page refresh/bootstrap cycles in
      # one browser worker; auth rate-limit behavior is covered by backend tests.
      RATE_LIMIT_AUTH_MAX: 200
      # Dashboard pages issue several API calls and SSE reconnects. Keep this workflow
      # focused on browser/session behavior; global-limit enforcement has integration tests.
      RATE_LIMIT_GLOBAL_MAX: 2000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Start backend
        run: nohup node dist/main.js > backend.log 2>&1 &

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/healthz > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become ready in time"
          cat backend.log
          exit 1

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Start dashboard dev server
        run: nohup npx vite --host 127.0.0.1 --port 5173 --strictPort > dashboard.log 2>&1 &
        working-directory: dashboard
        env:
          VITE_API_URL: http://localhost:3000

      - name: Wait for dashboard readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "Dashboard is up"
              exit 0
            fi
            sleep 1
          done
          echo "Dashboard did not become ready in time"
          cat dashboard.log
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: dashboard

      - name: Run reviewer-journey + accessibility suite
        run: npx playwright test
        working-directory: dashboard
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
          retention-days: 7

      - name: Upload backend/dashboard logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend.log
            dashboard/dashboard.log
          retention-days: 7
