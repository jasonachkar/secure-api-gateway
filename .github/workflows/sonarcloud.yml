# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow helps you trigger a SonarCloud analysis of your code and populates
# GitHub Code Scanning alerts with the vulnerabilities found.
# Free for open source project.

# 1. Login to SonarCloud.io using your GitHub account

# 2. Import your project on SonarCloud
#     * Add your GitHub organization first, then add your repository as a new project.
#     * Please note that many languages are eligible for automatic analysis,
#       which means that the analysis will start automatically without the need to set up GitHub Actions.
#     * This behavior can be changed in Administration > Analysis Method.
#
# 3. Follow the SonarCloud in-product tutorial
#     * a. Copy/paste the Project Key and the Organization Key into the args parameter below
#          (You'll find this information in SonarCloud. Click on "Information" at the bottom left)
#
#     * b. Generate a new token and add it to your Github repository's secrets using the name SONAR_TOKEN
#          (On SonarCloud, click on your avatar on top-right > My account > Security
#           or go directly to https://sonarcloud.io/account/security/)

# Feel free to take a look at our documentation (https://docs.sonarcloud.io/getting-started/github/)
# or reach out to our community forum if you need some help (https://community.sonarsource.com/c/help/sc/9)

name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results

jobs:
  Analysis:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      # SonarCloud requires a one-time setup outside this repo (create the SonarCloud
      # project, then add SONAR_TOKEN plus the project/org keys below as repo secrets -
      # see https://docs.sonarcloud.io/getting-started/github/). Until that's done, this
      # job reports a clear skip in the workflow summary instead of failing the run - a
      # missing optional secret is not a build break.
      - name: Check SonarCloud configuration
        id: sonar-config
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ] && [ -n "${{ vars.SONAR_PROJECT_KEY }}" ] && [ -n "${{ vars.SONAR_ORGANIZATION }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### SonarCloud analysis skipped"
              echo ""
              echo "\`SONAR_TOKEN\` and/or the \`SONAR_PROJECT_KEY\`/\`SONAR_ORGANIZATION\` repository variables are not set, so no analysis ran - this is not a quality gate result."
              echo ""
              echo "To enable: create the project at https://sonarcloud.io, then add repo secret \`SONAR_TOKEN\` and repo variables \`SONAR_PROJECT_KEY\`/\`SONAR_ORGANIZATION\` (Settings > Secrets and variables > Actions)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.sonar-config.outputs.configured == 'true'
        with:
          fetch-depth: 0 # SonarCloud needs full history for blame/new-code analysis

      - name: Analyze with SonarCloud
        if: steps.sonar-config.outputs.configured == 'true'
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216 # v2.2.0, pinned to commit SHA (third-party action)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          projectBaseDir: .
