name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read
  security-events: write # for SARIF upload

jobs:
  fmt-and-validate:
    name: fmt check & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.*'

      - name: terraform fmt -check
        run: terraform fmt -recursive -check

      - name: terraform init (no backend - validate only, no state access needed)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  security-scan:
    name: tfsec scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Upload SARIF first (if: always() below) so a blocking failure in the next
      # step still leaves findings visible in the Security tab, then fail the build
      # on CRITICAL/HIGH - matching docker.yml's Trivy gate. Before this, tfsec only
      # ever produced a SARIF report and never failed CI regardless of severity.
      - name: Run tfsec (SARIF, non-blocking - for code scanning upload)
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          sarif_file: tfsec.sarif
          working_directory: terraform

      - name: Upload tfsec results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec.sarif
          category: tfsec

      - name: Run tfsec (blocking on CRITICAL/HIGH)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: false
          additional_args: --minimum-severity HIGH
